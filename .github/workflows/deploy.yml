name: Deploy to GitHub Pages
on:
  push:
    branches: [ "main" ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # vue-router runs in history mode, so a deep link like /timeline is a real
      # path as far as GitHub Pages is concerned and Pages has no such file.
      # Pages serves 404.html for any unknown path, so shipping a copy of
      # index.html under that name lets the SPA boot and route client-side.
      # (PUBLIC_PATH is deliberately NOT set here: the Pages build keeps its
      # '/joi-button/' publicPath, so the copied file's asset URLs stay correct.)
      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html
      - name: Verify Build
        run: ls -la ./dist
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.ACTION_DEPLOY_KEY }}
          publish_dir: ./dist