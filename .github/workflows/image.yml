name: Build and publish container image

# Triggers are deliberately narrow.
#
# WHY THERE IS NO `branches: [ "**" ]` HERE, AND WHY YOU SHOULD NOT ADD ONE:
# pushing to GHCR is an outward publish — it creates/moves a package that lives
# outside this repository. The platform's delivery convention keeps the outward
# publish at the merge point, so the automatic trigger is `push` to `main` only.
# A push to a feature branch must never create a public package as a side effect.
# If you need an image from a branch, dispatch this workflow manually against
# that ref (workflow_dispatch, below) — that is a deliberate human act, and it
# will still not move `:latest` (see the tag computation step).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional extra tag to publish in addition to the short SHA (e.g. v2.5.0). Allowed characters: A-Z a-z 0-9 . _ -'
        required: false
        type: string
  push:
    branches: [ "main" ]
    # A version tag (vMAJOR.MINOR.PATCH) publishes an image tagged with that
    # version AND triggers the deploy-to-prod job below. Pushing to main only
    # builds/publishes; it never deploys. So `git tag v1.2.3 && git push --tags`
    # is the single, deliberate gesture that ships to production.
    tags: [ "v*.*.*" ]

# Least privilege: read the source, write packages. Nothing else.
# `packages: write` scopes the built-in GITHUB_TOKEN for GHCR; no PAT secret is
# involved, so there is no long-lived credential to rotate or leak.
permissions:
  contents: read
  packages: write

# Two publishes of the same ref must not race each other, but an in-flight
# publish is NOT cancelled — cancelling mid-push can leave a partially pushed
# manifest behind.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # NOTE ON ACTION PINNING (stated rather than left silent):
      # every third-party action below is pinned to a major version tag, which
      # is mutable — the tag owner can move it to new code. The stricter option
      # is to pin each action to a full commit SHA. That has deliberately NOT
      # been done yet: it costs a maintenance loop (Dependabot or manual bumps)
      # that this repo does not have set up. Treat this as known, accepted risk,
      # not as an oversight.
      - uses: actions/checkout@v4

      # Buildx gives us the `--platform` and `--build-arg` plumbing used below.
      # setup-qemu-action is intentionally absent: the target cluster is amd64
      # and ubuntu-latest runners are amd64, so nothing needs emulating.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference and tags
        id: meta
        env:
          # Interpolated into env, not into the script body: the dispatch input
          # is caller-controlled text, and pasting it straight into a shell line
          # would be a script-injection hole.
          OWNER: ${{ github.repository_owner }}
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # GHCR rejects uppercase characters in an image path. The owner is
          # `ryanlan-new` today, which is already lowercase — but lowercasing is
          # computed instead of hand-waved, so a future rename or transfer to a
          # mixed-case account cannot turn this into a confusing push failure.
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/joi-button/web"
          api_image="ghcr.io/${owner}/joi-button/api"

          short_sha="$(git rev-parse --short=7 HEAD)"

          if [ -n "${INPUT_TAG:-}" ]; then
            # Reject anything that is not a legal, boring tag rather than letting
            # the registry fail late with an opaque error.
            case "$INPUT_TAG" in
              *[!A-Za-z0-9._-]*)
                echo "::error::Refusing tag '$INPUT_TAG': only A-Z a-z 0-9 . _ - are allowed."
                exit 1
                ;;
            esac
          fi

          {
            echo "image=${image}"
            echo "short_sha=${short_sha}"
            echo "primary=${image}:${short_sha}"
            echo "tags<<TAGS_EOF"
            echo "${image}:${short_sha}"
            # `:latest` is only moved from the merge point. A manual dispatch
            # against a feature ref still gets an immutable :<short-sha> image,
            # but must not silently redefine what "latest" means for operators.
            if [ "$REF" = "refs/heads/main" ]; then
              echo "${image}:latest"
            fi
            if [ -n "${INPUT_TAG:-}" ]; then
              echo "${image}:${INPUT_TAG}"
            fi
            # On a version tag push, publish the version (vX.Y.Z) as an image tag
            # so deploy-to-prod can pin the exact version it ships.
            case "$REF" in refs/tags/*) echo "${image}:${REF#refs/tags/}" ;; esac
            echo "TAGS_EOF"
            # The API image carries the SAME tag scheme as web. One working tree,
            # one tag: deploy-k3s.sh pins both images from a single TAG, so "which
            # pair is running" must have one answer, not two.
            echo "api_image=${api_image}"
            echo "api_primary=${api_image}:${short_sha}"
            echo "api_tags<<API_TAGS_EOF"
            echo "${api_image}:${short_sha}"
            if [ "$REF" = "refs/heads/main" ]; then
              echo "${api_image}:latest"
            fi
            if [ -n "${INPUT_TAG:-}" ]; then
              echo "${api_image}:${INPUT_TAG}"
            fi
            case "$REF" in refs/tags/*) echo "${api_image}:${REF#refs/tags/}" ;; esac
            echo "API_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      # The palette gate, on a runner rather than only in a comment.
      #
      # `npm run contrast` reads src/App.vue's :root block and asserts all
      # every foreground/background pairing the site renders. It had existed
      # since the palette repair and was invoked by nothing — not the Dockerfile,
      # not this workflow, not the smoke test — which made it a comment rather
      # than a gate.
      #
      # It is a step of its own AS WELL AS a RUN inside the Dockerfile, and that
      # is not redundancy for its own sake: this step cannot be defeated by a
      # .dockerignore that fails to carry the checker into the build context,
      # and it fails in fifteen seconds instead of after a full image build. The
      # Dockerfile's copy is what protects a build somebody runs by hand.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Contrast gate on the default palette
        run: npm run contrast

      # Build once into the local daemon and SMOKE IT BEFORE PUBLISHING.
      # An image that is pushed before it has ever been started is a package
      # whose first real evaluation happens in the cluster; the runtime contract
      # (read-only root filesystem, the two writable mounts, the cache split,
      # honest 404s) is exactly what a started container can check and a build
      # cannot. The push step below re-runs the same build, which is a cache hit.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.primary }}
          build-args: |
            PUBLIC_PATH=/
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image as the cluster runs it
        env:
          PRIMARY: ${{ steps.meta.outputs.primary }}
        run: deploy/smoke-image.sh "$PRIMARY"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # The Dockerfile lives at the repository root. Stated explicitly so a
          # move shows up as a workflow edit rather than a mystery build failure.
          file: ./Dockerfile
          # amd64 ONLY. The target cluster is a single amd64 node; a multi-arch
          # manifest would roughly double build time and produce an arm64 layer
          # set nothing pulls.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            PUBLIC_PATH=/
          # Keep the pushed artifact a plain single-platform manifest. With
          # provenance on (buildx default when pushing) the result becomes an
          # OCI index carrying an extra `unknown/unknown` attestation manifest,
          # which older containerd/ctr tooling handles poorly — and the first
          # verification path for this image is `k3s ctr images import`.
          provenance: false
          cache-from: type=gha

      # The API image. NO smoke test here, and that is stated rather than hidden:
      # the API only starts with a database volume and a full credential set —
      # which the cluster provides and a bare `docker run` on the runner does not.
      # Its correctness is covered by its own test suite and by the /api/readyz
      # assertion deploy-k3s.sh makes against the running pod after rollout.
      #
      # Dockerfile.api's builder stage compiles better-sqlite3 (a native addon) as
      # the TARGET architecture. The runner is amd64 and the target is amd64, so
      # this is a native build — no QEMU, no BUILDPLATFORM cross-compile. A distinct
      # gha cache scope keeps it from thrashing the web image's cache.
      - name: Build and push the API image
        id: build_api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.api_tags }}
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Publish tag in job summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          PRIMARY: ${{ steps.meta.outputs.primary }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          API_IMAGE: ${{ steps.meta.outputs.api_image }}
          API_PRIMARY: ${{ steps.meta.outputs.api_primary }}
          API_TAGS: ${{ steps.meta.outputs.api_tags }}
          API_DIGEST: ${{ steps.build_api.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Container images published (web + api)"
            echo
            echo "Deploy this exact PAIR with the repository's own entrypoint —"
            echo "\`TAG=\` is required, because the script's own default (\`dev-<sha>\`)"
            echo "names LOCALLY built images, not these. One tag pins both:"
            echo
            echo '```bash'
            echo "ALLOW_REGISTRY_PULL=1 TAG=${SHORT_SHA} deploy/deploy-k3s.sh apply"
            echo '```'
            echo
            echo "Or paste them into the k8s Deployments over the \`replace-me\` placeholders:"
            echo
            echo '```yaml'
            echo "        # joi-button-web"
            echo "        image: ${PRIMARY}"
            echo "        # joi-button-api"
            echo "        image: ${API_PRIMARY}"
            echo '```'
            echo
            echo "| image | repository | digest |"
            echo "| --- | --- | --- |"
            echo "| web | \`${IMAGE}\` | \`${DIGEST}\` |"
            echo "| api | \`${API_IMAGE}\` | \`${API_DIGEST}\` |"
            echo
            echo "Platform: \`linux/amd64\`"
            echo
            echo "All tags pushed by this run:"
            echo
            printf '%s\n' "$TAGS" | sed 's/^/- `/; s/$/`/'
            printf '%s\n' "$API_TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Ship a version tag to production.
  #
  # Runs ONLY on a `v*.*.*` tag push, and ONLY after build-and-push has published
  # both images for that tag. A push to main builds images but never deploys —
  # tags deploy them. It ssh's to the node, checks out the tag (so the deploy
  # scripts match the version), and applies from the registry pinned to this tag.
  #
  # SECRETS IT NEEDS (repo Settings → Secrets and variables → Actions):
  #   PROD_SSH_KEY      private key of a deploy keypair whose PUBLIC key is in the
  #                     node's ~/.ssh/authorized_keys
  #   PROD_SSH_HOST     the node's address
  #   PROD_SSH_USER     the ssh user on the node
  #   PROD_KNOWN_HOSTS  the node's host key (`ssh-keyscan -H <host>`); pins the
  #                     server identity. If unset, the key is trusted on first use.
  #
  # THE NODE must let that user run kubectl NON-interactively (a sudo password
  # prompt has nowhere to read from here): either passwordless sudo for k3s, or a
  # readable kubeconfig plus `KUBECTL=kubectl` in deploy/deploy.env.
  # ---------------------------------------------------------------------------
  deploy-to-prod:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ${{ github.ref_name }} to prod over ssh
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          DEPLOY_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # DEPLOY_TAG lands in a remote shell command below, so accept only a
          # plain vMAJOR.MINOR.PATCH — nothing that could carry a shell metachar.
          case "$DEPLOY_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::refusing to deploy non-version tag '$DEPLOY_TAG'"; exit 1 ;;
          esac
          : "${SSH_KEY:?PROD_SSH_KEY secret is not set}"
          : "${SSH_HOST:?PROD_SSH_HOST secret is not set}"
          : "${SSH_USER:?PROD_SSH_USER secret is not set}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            host_check="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          else
            host_check="-o StrictHostKeyChecking=accept-new"
          fi

          echo "Deploying ${DEPLOY_TAG} to ${SSH_HOST} ..."
          # DEPLOY_TAG is validated above; it is expanded here (client side) on purpose.
          # shellcheck disable=SC2029,SC2086
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes $host_check "${SSH_USER}@${SSH_HOST}" \
            "set -e; cd ~/joi-button; git fetch --quiet --tags --force origin; git -c advice.detachedHead=false checkout --quiet --force 'refs/tags/${DEPLOY_TAG}'; IMAGE_SOURCE=registry TAG='${DEPLOY_TAG}' bash deploy/deploy-k3s.sh apply"
          echo "Deployed ${DEPLOY_TAG}."
