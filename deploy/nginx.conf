# joi-button static SPA runtime config.
#
# WHERE THIS FILE LIVES IN THE IMAGE
#   The Dockerfile installs it as /etc/nginx/nginx.conf, i.e. it is the COMPLETE
#   main config, not a conf.d snippet.  Reason: `pid` is a main-context
#   directive, so the "pid must be under /tmp" requirement cannot be expressed
#   from inside /etc/nginx/conf.d/*.conf.  Owning the whole file also means
#   nothing here silently depends on the base image's own nginx.conf.
#   Consequence: the base image's leftover /etc/nginx/conf.d/default.conf is
#   NOT included by this file and is therefore inert.  Do not add
#   `include /etc/nginx/conf.d/*.conf;` unless you also delete that file, or
#   you will get a second, unwanted server block on 8080.
#
# RUNTIME CONTRACT THIS FILE ASSUMES (must match the k8s Deployment)
#   * process runs as uid/gid 101, root filesystem is READ-ONLY
#   * emptyDir mounts exist at /tmp and /var/cache/nginx
#   * the only listener is 8080 (non-root cannot bind 80)
#   * static root is /usr/share/nginx/html
#   * OPTIONAL: the API's shared volume is mounted READ-ONLY at /srv/shared,
#     holding catalog.json, media/, theme.css and wallpaper/.  The site works
#     without it — the frontend falls back to the catalogue snapshot AND the
#     palette compiled into its bundle — so a first deploy, or a deploy without
#     the API, serves the twelve founding clips in the original colours rather
#     than failing.
#
# NGINX add_header GOTCHA (read before "simplifying" this file)
#   add_header is inherited from the enclosing level ONLY when the current
#   level declares no add_header of its own.  The three security headers are
#   therefore set at server level AND repeated verbatim in every location that
#   declares any add_header.  Deleting a repetition silently drops the security
#   headers for that location.

# Not `auto`: that counts the NODE's CPUs, which nginx does not read from the
# cgroup limit.  On a many-core node `auto` would start one worker per host core
# against a 200m CPU limit and a 96Mi memory limit.
worker_processes  2;

# Read-only rootfs: the compiled-in default (/var/run/nginx.pid) is not writable.
pid  /tmp/nginx.pid;

# Containers log to the process streams, never to a file on the read-only layer.
error_log  stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types_hash_max_size  2048;

    # ---- utf-8 for the zh-CN / ja-JP / en-US UI -------------------------
    # The locale strings are bundled into the JS chunks and the page title is
    # CJK, so the charset must be asserted on the wire, not only in <meta>.
    charset  utf-8;
    # text/html is always included and must not be listed again — nginx warns
    # "duplicate MIME type" at startup, which is noise that hides real warnings.
    charset_types
        text/css
        text/plain
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---- read-only rootfs: every scratch path is ONE level below a mount --
    # nginx creates each of these with a single non-recursive mkdir() at
    # startup (ngx_create_paths -> ngx_create_dir, where any errno other than
    # EEXIST is fatal).  So the parent must already exist, and the only
    # directories that exist here at runtime are the two emptyDir mountpoints
    # themselves: an emptyDir starts empty and masks whatever the image layer
    # had underneath, so a `mkdir -p` in the Dockerfile cannot help.
    # /var/cache/nginx is the parent, which is what that mount is for.
    client_body_temp_path  /var/cache/nginx/client_temp;
    proxy_temp_path        /var/cache/nginx/proxy_temp;
    fastcgi_temp_path      /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path        /var/cache/nginx/uwsgi_temp;
    scgi_temp_path         /var/cache/nginx/scgi_temp;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    sendfile              on;
    tcp_nopush            on;
    tcp_nodelay           on;
    keepalive_timeout     65;
    server_tokens         off;
    etag                  on;   # explicit: index.html revalidation relies on it
    client_max_body_size  1m;   # nothing here accepts uploads

    # Behind the traefik ingress: emit relative redirects so nginx never leaks
    # its own scheme/host/port (e.g. http://pod-ip:8080/...) into Location.
    absolute_redirect  off;
    port_in_redirect   off;

    # ---- compression ---------------------------------------------------
    gzip             on;
    gzip_vary        on;
    gzip_comp_level  6;
    gzip_min_length  256;
    gzip_proxied     any;
    # text/html is always compressed and must not be listed.
    # DELIBERATELY ABSENT: audio/mpeg and every other audio/* type.  The .mp3
    # voice files are already compressed, and gzipping them would also kill the
    # byte-range requests the <audio> element uses to seek.  woff/woff2 are
    # omitted for the same "already compressed" reason.
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---- the Content-Security-Policy, written once ----------------------
    # A `map` rather than eleven copies of the policy string. add_header is
    # inherited only when the current level declares NO add_header of its own
    # (see the gotcha at the top of this file), so every location below that
    # sets any header has to re-emit this one — and eleven copies of a 500-byte
    # policy is eleven chances for them to drift apart, with the difference
    # invisible until somebody diffs two curl outputs.
    #
    # $host is a stand-in: the policy does not vary, and `map` needs a source
    # variable. `default` is therefore the only entry, and it is the answer for
    # every request.
    #
    # The reasoning for each source is at the server-level add_header below.
    map $host $csp {
        default "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: https://img.shields.io; media-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
    }

    server {
        listen       8080  default_server;   # never 80: the process is non-root
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Server-level security headers.  Any location below that declares its
        # own add_header must repeat these three (see the gotcha at the top).
        add_header  X-Content-Type-Options  "nosniff"                        always;
        add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header  X-Frame-Options         "SAMEORIGIN"                     always;
        # ---- Content-Security-Policy -----------------------------------
        # There used to be none, on the argument that "a CSP tight enough to be
        # worth having would break the Google font import or the shields.io
        # badge, and one loose enough to be provably safe would add nothing".
        # The first half is still true and the second half is not, and what
        # changed is what the page now contains:
        #
        #   * submitter-authored text reaches it, as caption VALUES in
        #     catalog.json;
        #   * the review desk renders reviewer- and submitter-written strings;
        #   * the theming work puts owner-supplied colour values into a :root
        #     block and an owner-supplied image behind the page;
        #   * Turnstile injects a script from another origin.
        #
        # Every one of those is escaped at the layer that owns it — schema.sql
        # CHECKs, lib/text-safety.mjs, vue-i18n interpolation — and this is the
        # backstop for the day one of them has a hole. `script-src` WITHOUT
        # 'unsafe-inline' is the control that matters, and it is available even
        # though `style-src` cannot have the same treatment.
        #
        # WHY style-src KEEPS 'unsafe-inline', stated rather than hidden: Vue 2
        # `:style` bindings compile to element.style assignments, the theming
        # feature is a generated :root block, and Bootstrap 3's own JS writes
        # inline styles. A nonce cannot cover any of those. So this policy does
        # not claim to stop CSS injection; it stops SCRIPT injection, which is
        # the difference between a defaced caption and a stolen session.
        #
        # Each source, and the one thing that would break without it:
        #   default-src 'self'          everything unlisted stays on this origin
        #   script-src                  no inline, no eval; challenges.cloudflare.com
        #                               is the Turnstile widget (STORY-023/028) and
        #                               without it the challenge never renders
        #   style-src                   see above; fonts.googleapis.com serves the
        #                               @import at the top of the built stylesheet
        #   font-src                    fonts.googleapis.com hands back @font-face
        #                               rules pointing at fonts.gstatic.com
        #   img-src 'self' data:        the wallpaper and the published art; data:
        #                               is what webpack inlines small assets as.
        #                               img.shields.io is the footer's stars badge
        #   media-src 'self'            audio only ever comes off our own volume
        #   connect-src 'self'          the API is same-origin by construction
        #                               (deploy/k8s/ingress.yaml routes /api here)
        #   frame-src                   Turnstile's iframe
        #   frame-ancestors 'self'      the modern X-Frame-Options; both are sent,
        #                               because CSP wins where it is understood and
        #                               the header covers what does not
        #   base-uri 'self'             an injected <base> would repoint every
        #                               relative URL on the page, including the
        #                               audio and the API
        #   form-action 'self'          nothing here posts anywhere else
        #   object-src 'none'           there are no plugins and never will be
        #
        # NOT report-only. A policy nobody reads reports is a policy that is not
        # enforcing anything; this one was checked against the running site
        # (fonts load, badge renders, audio plays, the SPA boots) before it went
        # in, and deploy/smoke-image.sh asserts its presence and its shape.
        add_header  Content-Security-Policy  $csp  always;

        # ---- kubernetes probe ------------------------------------------
        # Exact-match location, so it can never be shadowed by the SPA
        # fallback: this returns a 2-byte text/plain body, never index.html.
        location = /healthz {
            access_log    off;
            default_type  text/plain;
            return        200 "ok";
        }

        # ---- entry document: must revalidate on every load -------------
        # Reached directly, via `/` (index directive) and via the SPA fallback
        # below; an internal redirect re-runs location matching, so all three
        # paths land here and get the same headers.
        # No `expires` directive => no Expires header, only Cache-Control.
        location = /index.html {
            add_header  Cache-Control  "no-cache, must-revalidate"           always;
            add_header  X-Content-Type-Options  "nosniff"                        always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  X-Frame-Options         "SAMEORIGIN"                     always;
            add_header  Content-Security-Policy  $csp  always;
        }

        # Same treatment for /404.html.  Nothing emits one any more — it was the
        # GitHub Pages SPA fallback, produced by that workflow rather than by the
        # build, and Pages is retired.  The block is kept because it costs
        # nothing and stops a future 404.html from being frozen for a year.
        location = /404.html {
            add_header  Cache-Control  "no-cache, must-revalidate"           always;
            add_header  X-Content-Type-Options  "nosniff"                        always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  X-Frame-Options         "SAMEORIGIN"                     always;
            add_header  Content-Security-Policy  $csp  always;
        }

        # ---- web app manifest -----------------------------------------
        # Pinned MIME type instead of trusting mime.types to carry
        # `webmanifest`: an empty `types {}` block clears the inherited map for
        # this one exact URI only.
        location = /site.webmanifest {
            types        { }
            default_type  application/manifest+json;
            # Stable filename, editable content — so bounded, not immutable.
            expires       1h;
            add_header  Cache-Control  "public, max-age=3600, must-revalidate";
            add_header  X-Content-Type-Options  "nosniff"                        always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  X-Frame-Options         "SAMEORIGIN"                     always;
            add_header  Content-Security-Policy  $csp  always;
        }

        # Browsers ask for /favicon.ico unprompted; this app ships
        # resources/favicon/favicon.png instead.  Answer 404 quietly.
        location = /favicon.ico {
            access_log     off;
            log_not_found  off;
            try_files      $uri =404;
        }

        # ---- REMOVED: the legacy /joi-button/ rewrite -------------------
        # There used to be a `location ^~ /joi-button/` here that stripped the
        # prefix, because two files hardcoded it in a way PUBLIC_PATH could not
        # rewrite: src/App.vue's `url('/joi-button/resources/body_bg.svg')` and
        # public/site.webmanifest's icon src.  BOTH ARE FIXED — the background
        # moved to src/assets/ so webpack emits and rewrites it, and the manifest
        # now uses a relative icon path — and vue.config.js's production default
        # is no longer '/joi-button/' either, so nothing emits that prefix.
        #
        # It is deleted rather than left in place, and that is the safer choice
        # rather than the riskier one: while it existed, a build that WAS made
        # with the wrong publicPath would have half-worked behind the rewrite —
        # which is precisely how a misconfiguration survives a deploy.  Without
        # it such a build 404s on its first asset.  Two gates catch it before
        # that: the Dockerfile compares the emitted prefix against PUBLIC_PATH,
        # and deploy/smoke-image.sh refutes any '/joi-button/' path in the served
        # index.html and stylesheet.

        # ---- never serve dotfiles -------------------------------------
        # Regex locations are tried in source order, so this precedes the asset
        # rule.  It matches a dot only immediately after a slash, so voice file
        # names such as "Arctic Eggs_nonononono..-.mp3" are unaffected.
        #
        # WHAT THIS RULE CANNOT REACH, AND WHY IT IS REPEATED BELOW
        #   nginx picks the longest matching prefix location first, and a `^~`
        #   match ENDS the search — no regex location is tried at all.  So this
        #   block is never evaluated for any URL under `^~ /media/`,
        #   `^~ /wallpaper/` or `^~ /voices/`, and for a long time it silently
        #   was not: `/wallpaper/.wallpaper-tmp-<uuid>` was served 200 with the
        #   body of a half-written upload and the label `public, immutable`,
        #   i.e. frozen in every cache that fetched it for a year.  MEASURED
        #   against this file in nginx 1.28-alpine, not reasoned about.
        #   The fix is a NESTED copy of this rule inside each of those three
        #   blocks — nested regex locations ARE evaluated once the outer prefix
        #   has won.  Adding a fourth `^~` location means adding a fourth copy;
        #   deploy/smoke-image.sh seeds a dot-file under the shared volume and
        #   asserts the 404, so the omission is caught rather than reasoned about.
        location ~ /\. {
            access_log     off;
            log_not_found  off;
            return         404;
        }

        # ---- immutable: only what is genuinely safe to freeze -----------
        # `immutable` for a year is a promise that the bytes at this URL will
        # never change, and it is unrecoverable if wrong: every visitor that
        # cached it keeps the stale copy for a year.  So it is granted to
        # exactly two families, both of which guarantee a new NAME on new bytes:
        #   1. webpack output carrying a content hash (js/app.1a2b3c4d.js,
        #      img/foo.1a2b3c4d.png, fonts/…);
        #   2. /voices/*, where the project convention is that a new or
        #      re-cut voice file MUST get a new filename (README, "strong
        #      cache strategy").
        # Everything else under public/ — favicon.png, body_bg.svg,
        # site.webmanifest, small_box.png — keeps a STABLE name across edits and
        # is handled by the short-lived rule below.
        #
        # No `always` on Cache-Control: `expires` is skipped by nginx for 4xx,
        # but `always` would force the header out anyway, labelling a 404
        # "public, immutable" with no max-age.  The three security headers do
        # want `always`.
        # The pattern MUST stay quoted: it contains `{8,32}`, and nginx's config
        # lexer reads an unquoted `{` as the start of a block, failing with
        # `unknown directive` at startup.
        location ~* "^/(?:js|css|img|fonts)/.+\.[0-9a-f]{8,32}\.[a-z0-9]+$" {
            expires     1y;
            add_header  Cache-Control  "public, immutable";
            add_header  X-Content-Type-Options  "nosniff"                        always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  X-Frame-Options         "SAMEORIGIN"                     always;
            add_header  Content-Security-Policy  $csp  always;
            try_files   $uri =404;
        }

        # ---- the API's shared volume ------------------------------------
        # The API writes catalog.json and the published media onto a volume this
        # pod mounts READ-ONLY, and nginx serves them from here. That is why the
        # site keeps working while the API pod is down, and with CURRENT data
        # rather than whatever was baked into the image — and why there is no
        # cross-origin fetch, no mixed content and no loading state to design.
        #
        # Media is content-addressed (/media/<sha256-prefix>.mp3), so `immutable`
        # is not a promise anyone has to keep: the URL IS the hash. New bytes get
        # a new URL by construction.
        # ---- staging is never published ---------------------------------
        # In-flight uploads live in /srv/shared/incoming/, a SIBLING of media/,
        # so they are outside every alias below and this block has nothing to
        # catch today. It exists because they used to live in
        # /srv/shared/media/tmp/ — inside the tree published here, labelled
        # `immutable` for a year — which made an unreviewed clip fetchable at a
        # content-addressed URL for the length of its own upload, and cached for
        # a year by anyone who fetched it.
        #
        # server/routes/public.mjs is what fixed that, and this is the second
        # lock on the same door: if staging is ever moved back under media/, the
        # bytes still do not reach the internet. `^~` with a longer prefix beats
        # the /media/ block below, so this is decided before the alias is.
        # deploy/smoke-image.sh proves it by putting a real file there.
        location ^~ /media/tmp/ {
            access_log     off;
            log_not_found  off;
            return         404;
        }

        location ^~ /media/ {
            alias       /srv/shared/media/;
            expires     1y;
            add_header  Cache-Control  "public, immutable";
            add_header  X-Content-Type-Options  "nosniff"                        always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  X-Frame-Options         "SAMEORIGIN"                     always;
            add_header  Content-Security-Policy  $csp  always;
            try_files   $uri =404;

            # The dotfile rule again, where it can actually be reached: `^~`
            # above ends location matching before any regex is tried.  This
            # tree is written by the API's atomic writes, whose temp files are
            # dot-prefixed, and everything here is labelled immutable.
            location ~ /\. {
                access_log     off;
                log_not_found  off;
                return         404;
            }
        }

        # The catalogue is the one file here that CHANGES at a stable name, so it
        # gets its own rule ahead of the generic *.json one below. That generic
        # rule grants an hour, which was written for a static site's odds and ends
        # and would have made every approval take up to sixty minutes to reach a
        # visitor — a cost of the delivery, not of the database. no-cache plus the
        # ETag nginx already emits makes it immediate at the price of one
        # conditional request against a same-origin file of a few kilobytes.
        location = /catalog.json {
            alias       /srv/shared/catalog.json;
            add_header  Cache-Control  "no-cache"                                always;
            add_header  X-Content-Type-Options  "nosniff"                        always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  X-Frame-Options         "SAMEORIGIN"                     always;
            add_header  Content-Security-Policy  $csp  always;
            # The volume may not be mounted yet on a first deploy. 404 is the
            # honest answer and the frontend already falls back to the snapshot
            # compiled into its bundle.
            try_files   $uri =404;
        }

        # The owner's theme, in the same shape as the catalogue: the API writes
        # it, this pod serves it read-only, and it CHANGES AT A STABLE NAME.
        # `= /theme.css` for the same reason /catalog.json is exact — an exact
        # match is decided before any regex is tried, so the generic *.css rule
        # further down (one hour, `expires`) can never reach this URL.  It would
        # be wrong in the ordinary direction rather than the dangerous one, but
        # an hour is still an hour of a saved theme not being on screen, and the
        # owner would be told the save worked.
        #
        # `immutable` would be the dangerous direction and is deliberately not
        # granted: the bytes here are replaced in place every time a theme is
        # saved or cleared, so freezing them for a year would pin every visitor
        # to whichever theme they happened to load first, with no way to correct
        # it.  no-cache plus the ETag nginx already emits makes a change visible
        # on the next navigation, at the price of one conditional request
        # against a file of a few hundred bytes.
        location = /theme.css {
            alias       /srv/shared/theme.css;
            add_header  Cache-Control  "no-cache"                                always;
            add_header  X-Content-Type-Options  "nosniff"                        always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  X-Frame-Options         "SAMEORIGIN"                     always;
            add_header  Content-Security-Policy  $csp  always;
            # No file until an owner saves a theme, and none at all on a deploy
            # without the volume. 404 is the honest answer: public/index.html
            # links this stylesheet unconditionally and a link that 404s costs
            # the page nothing — it falls back to the palette compiled into its
            # own bundle, which is the palette the site shipped with.
            try_files   $uri =404;
        }

        # The theme's wallpaper.  Content-addressed by construction — the
        # filename is `<sha256>.<ext>`, enforced by a CHECK constraint in
        # server/db/schema.sql — so `immutable` for a year is a promise the name
        # keeps by itself, exactly as for /media/ above.  New bytes cannot reuse
        # this URL, so no visitor can be stranded on a stale copy.
        #
        # `^~` so the decision is made here rather than by the generic image
        # rule below, which would hand back one hour and re-fetch a file that
        # can never change.
        location ^~ /wallpaper/ {
            alias       /srv/shared/wallpaper/;
            expires     1y;
            add_header  Cache-Control  "public, immutable";
            add_header  X-Content-Type-Options  "nosniff"                        always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  X-Frame-Options         "SAMEORIGIN"                     always;
            add_header  Content-Security-Policy  $csp  always;
            try_files   $uri =404;

            # THE ONE THAT MATTERS MOST, and the one that was actually broken.
            # server/lib/wallpaper.mjs writes a new wallpaper to
            # `.wallpaper-tmp-<uuid>` IN THIS DIRECTORY (rename is atomic only
            # within a filesystem, so the temp file cannot live anywhere else)
            # and renames it into place.  A crash between those two steps leaves
            # a half-written picture here.  Without this block the `^~` above
            # ended location matching before the top-level dotfile rule was
            # tried, so that leftover was served 200 — with a partial image
            # body, and `Cache-Control: public, immutable, max-age=31536000`,
            # which no cache would re-check for a year.
            location ~ /\. {
                access_log     off;
                log_not_found  off;
                return         404;
            }
        }

        # `^~` so this wins over the regex rules below without them having to
        # know about it.
        location ^~ /voices/ {
            expires     1y;
            add_header  Cache-Control  "public, immutable";
            add_header  X-Content-Type-Options  "nosniff"                        always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  X-Frame-Options         "SAMEORIGIN"                     always;
            add_header  Content-Security-Policy  $csp  always;
            # =404, not the SPA fallback: an <audio> element must get a 404 for
            # a missing file, never a 200 carrying an index.html body labelled
            # audio/mpeg.  src/App.vue currently requests voices/GR_OniiChan.mp3,
            # which does not exist — that must fail visibly.
            try_files   $uri =404;

            # The dotfile rule again, for the `^~` reason above.  Nothing writes
            # temp files here — /voices/ comes off the image's own layer — so
            # this one is for the invariant rather than for a known leak: "this
            # server never serves a dot segment" should be true of every tree,
            # not of the trees that happen to have no prefix location.
            location ~ /\. {
                access_log     off;
                log_not_found  off;
                return         404;
            }
        }

        # ---- other static files: cacheable, but re-checked --------------
        # Unhashed names, so they may legitimately change in place.  One hour
        # plus revalidation keeps them cheap without freezing them.
        # `html` is deliberately absent from this list.
        location ~* \.(?:css|js|mjs|map|json|webmanifest|png|jpe?g|gif|bmp|ico|svg|webp|avif|mp3|ogg|wav|m4a|flac|mp4|webm|woff2?|ttf|otf|eot|txt|xml)$ {
            expires     1h;
            add_header  Cache-Control  "public, max-age=3600, must-revalidate";
            add_header  X-Content-Type-Options  "nosniff"                        always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  X-Frame-Options         "SAMEORIGIN"                     always;
            add_header  Content-Security-Policy  $csp  always;
            try_files   $uri =404;
        }

        # ---- SPA fallback ---------------------------------------------
        # vue-router runs in history mode (src/router.js), so unknown paths must
        # resolve to the app shell.  The final parameter has no `=`, so nginx
        # internally redirects to /index.html and location matching runs again,
        # picking up the no-cache headers above.
        # Anything else that lands here (extensionless files such as a CNAME)
        # gets the conservative no-cache treatment.
        #
        # NO `$uri/` test: dist/ contains real directories (voices, resources,
        # js, css, img, fonts).  With `$uri/` present, a request for /resources
        # matches the directory, nginx 301-redirects to /resources/, finds no
        # index.html inside it and answers 403 — instead of falling through to
        # the app shell.  Dropping the test also removes a pointless redirect
        # hop; `/` itself still reaches index.html, because a directory is not a
        # match for the first parameter.
        location / {
            try_files   $uri /index.html;
            add_header  Cache-Control  "no-cache"                            always;
            add_header  X-Content-Type-Options  "nosniff"                        always;
            add_header  Referrer-Policy         "strict-origin-when-cross-origin" always;
            add_header  X-Frame-Options         "SAMEORIGIN"                     always;
            add_header  Content-Security-Policy  $csp  always;
        }
    }
}
